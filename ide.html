<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINKOWSKI IDE</title>
<script src="interpreter.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #050810;
  --surface:   #090d16;
  --panel:     #0c1020;
  --border:    #16213a;
  --border2:   #1e2f4a;
  --cyan:      #00cef5;
  --cyan-d:    #00708a;
  --cyan-glow: rgba(0,206,245,0.12);
  --orange:    #ff6b35;
  --orange-d:  rgba(255,107,53,0.12);
  --green:     #5dfc9e;
  --green-d:   rgba(93,252,158,0.09);
  --amber:     #ffbe45;
  --violet:    #b57bff;
  --text:      #bfcfe0;
  --text-d:    #4a6a88;
  --text-m:    #1e3248;
  --font: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── HEADER ──────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  user-select: none;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 5px;
  color: var(--cyan);
}

.brand-sub {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-d);
}

.sep { width: 1px; height: 28px; background: var(--border2); }

.controls { display: flex; gap: 5px; }

button {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-d);
  font-family: var(--font);
  font-size: 11px;
  padding: 5px 13px;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1.5px;
  transition: all 0.12s;
  white-space: nowrap;
}
button:hover          { color: var(--text); border-color: var(--text-d); }
#btn-run:hover        { color: var(--green); border-color: var(--green); background: var(--green-d); }
#btn-run.active       { color: var(--green); border-color: var(--green); background: var(--green-d); }
#btn-step:hover       { color: var(--amber); border-color: var(--amber); }
#btn-stop:hover       { color: var(--orange); border-color: var(--orange); background: var(--orange-d); }
button:disabled       { opacity: 0.3; cursor: default; pointer-events: none; }

.examples-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--text-d);
  letter-spacing: 1px;
}

select {
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
select:hover { border-color: var(--cyan-d); }

.speed-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  font-size: 10px;
  color: var(--text-d);
  letter-spacing: 1px;
}
input[type=range] {
  width: 72px;
  accent-color: var(--cyan);
  cursor: pointer;
}
#speed-val { color: var(--cyan); width: 28px; display: inline-block; }

.status {
  font-size: 10px;
  letter-spacing: 2px;
  padding: 4px 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--text-d);
  white-space: nowrap;
}
.status.run   { color: var(--green);  border-color: rgba(93,252,158,0.3); background: var(--green-d); }
.status.step  { color: var(--amber);  border-color: rgba(255,190,69,0.3); }
.status.halt  { color: var(--text-d); }
.status.error { color: var(--orange); border-color: rgba(255,107,53,0.3); }

/* ── MAIN ────────────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── EDITOR ──────────────────────────────────────────────────── */
.editor-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-width: 0;
  border-right: 1px solid var(--border);
}

.gutter {
  width: 50px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding-top: 13px;
}

.gutter-line {
  height: 22px;
  line-height: 22px;
  text-align: right;
  padding-right: 10px;
  font-size: 12px;
  color: var(--text-m);
  transition: color 0.08s, background 0.08s;
  cursor: default;
}
.gutter-line.pc {
  color: var(--orange) !important;
  background: rgba(255,107,53,0.1);
  font-weight: 700;
}
.gutter-line.done { color: var(--text-d); }

#editor {
  flex: 1;
  background: var(--panel);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 22px;
  padding: 13px 16px;
  border: none;
  outline: none;
  resize: none;
  overflow-y: scroll;
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
  caret-color: var(--cyan);
}
#editor::selection { background: rgba(0,206,245,0.18); }
#editor::-webkit-scrollbar { width: 5px; height: 5px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── RIGHT PANE ──────────────────────────────────────────────── */
.right-pane {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
}

.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel + .panel { border-top: 1px solid var(--border); }

.panel-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-d);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.panel-head .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan-d);
  flex-shrink: 0;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.75;
  min-height: 0;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* Output */
.out-line {
  color: var(--green);
  white-space: pre-wrap;
  word-break: break-all;
}
.out-line::before { content: '▸ '; color: var(--cyan-d); font-size: 10px; }
.out-empty { color: var(--text-d); font-style: italic; font-size: 11px; }

/* Memory */
.mem-row {
  display: flex;
  gap: 0;
  padding: 1px 0;
  border-bottom: 1px solid rgba(22,33,58,0.6);
  align-items: baseline;
}
.mem-row.pc-row { background: rgba(255,107,53,0.08); border-radius: 2px; }

.mem-addr {
  color: var(--amber);
  width: 30px;
  flex-shrink: 0;
  text-align: right;
  font-size: 11px;
  opacity: 0.7;
}
.mem-row.pc-row .mem-addr { color: var(--orange); opacity: 1; }

.mem-colon { color: var(--text-m); padding: 0 5px 0 2px; font-size: 11px; }

.mem-val {
  color: var(--text);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.mem-val.mod { color: var(--cyan); }

/* ── INPUT OVERLAY ───────────────────────────────────────────── */
#input-overlay {
  position: fixed; inset: 0;
  background: rgba(5,8,16,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
#input-overlay.hidden { display: none; }

.input-box {
  background: var(--surface);
  border: 1px solid var(--cyan);
  border-radius: 6px;
  padding: 24px 26px;
  min-width: 300px;
  box-shadow: 0 0 60px rgba(0,206,245,0.12), 0 0 0 1px var(--border);
}
.input-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--cyan-d);
  margin-bottom: 5px;
}
.input-info {
  font-size: 12px;
  color: var(--cyan);
  margin-bottom: 16px;
}
.input-box input[type=text] {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 11px;
  outline: none;
  margin-bottom: 11px;
  caret-color: var(--cyan);
}
.input-box input[type=text]:focus { border-color: var(--cyan); }
.input-box button {
  width: 100%;
  padding: 8px;
  background: var(--cyan-glow);
  border-color: var(--cyan-d);
  color: var(--cyan);
  letter-spacing: 3px;
  font-size: 11px;
}
.input-box button:hover { background: rgba(0,206,245,0.2); border-color: var(--cyan); }

/* ── SCROLLBAR SYNC ──────────────────────────────────────────── */
.gutter::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">MINKOWSKI</div>
    <div class="brand-sub">MINIMALIST KODING WRITING SYSTEM</div>
  </div>
  <div class="sep"></div>
  <div class="controls">
    <button id="btn-run">▶ RUN</button>
    <button id="btn-step">⏭ STEP</button>
    <button id="btn-stop" disabled>⏹ STOP</button>
    <button id="btn-reset">↺ RESET</button>
  </div>
  <div class="sep"></div>
  <div class="examples-wrap">
    ESEMPI
    <select id="examples">
      <option value="">── scegli ──</option>
      <option value="hello">Hello World</option>
      <option value="counter">Contatore 1–5</option>
      <option value="input">Saluto</option>
      <option value="selfmod">Auto-modifica</option>
      <option value="fib">Fibonacci</option>
    </select>
  </div>
  <div class="speed-wrap">
    VELOCITÀ
    <input type="range" id="speed" min="0" max="5" value="3">
    <span id="speed-val">×1</span>
  </div>
  <div class="status" id="status">PRONTO</div>
</header>

<main>
  <div class="editor-wrap">
    <div class="gutter" id="gutter"></div>
    <textarea id="editor" spellcheck="false" autocorrect="off"
              autocomplete="off" autocapitalize="off"></textarea>
  </div>

  <div class="right-pane">
    <div class="panel" style="flex:1">
      <div class="panel-head"><div class="dot"></div>OUTPUT</div>
      <div class="panel-body" id="output">
        <div class="out-empty">nessun output</div>
      </div>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-head"><div class="dot"></div>MEMORIA</div>
      <div class="panel-body" id="memory"></div>
    </div>
  </div>
</main>

<div id="input-overlay" class="hidden">
  <div class="input-box">
    <div class="input-label">INPUT RICHIESTO</div>
    <div class="input-info" id="input-info">riga 0 attende un valore</div>
    <input type="text" id="input-field" placeholder="inserisci valore…">
    <button id="input-ok">CONFERMA</button>
  </div>
</div>

<script>
// ── Elements ──────────────────────────────────────────────────────────────────
const editor      = document.getElementById('editor');
const gutter      = document.getElementById('gutter');
const outputEl    = document.getElementById('output');
const memoryEl    = document.getElementById('memory');
const statusEl    = document.getElementById('status');
const inputOverlay = document.getElementById('input-overlay');
const inputField  = document.getElementById('input-field');
const inputOk     = document.getElementById('input-ok');
const inputInfo   = document.getElementById('input-info');
const speedSlider = document.getElementById('speed');
const speedVal    = document.getElementById('speed-val');
const examplesEl  = document.getElementById('examples');

const btnRun   = document.getElementById('btn-run');
const btnStep  = document.getElementById('btn-step');
const btnStop  = document.getElementById('btn-stop');
const btnReset = document.getElementById('btn-reset');

// ── Interpreter ───────────────────────────────────────────────────────────────
const interp = new MinkowskiInterpreter();
let isRunning    = false;
let stepMode     = false;
let origLines    = [];
let inputResolver = null;

// ── Speed ─────────────────────────────────────────────────────────────────────
const SPEEDS = [
  ['×¼', 800], ['×½', 300], ['×1', 100], ['×2', 30], ['×4', 5], ['MAX', 0]
];
speedSlider.addEventListener('input', () => {
  speedVal.textContent = SPEEDS[+speedSlider.value][0];
});
speedVal.textContent = SPEEDS[+speedSlider.value][0];

// ── Gutter (line numbers) ─────────────────────────────────────────────────────
function buildGutter(pcLine = null, doneBefore = 0) {
  const lines = editor.value.split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const n   = i + 1;
    let cls = '';
    if (n === pcLine)      cls = ' pc';
    else if (n < doneBefore) cls = ' done';
    html += `<div class="gutter-line${cls}">${n}</div>`;
  }
  gutter.innerHTML = html;
  gutter.scrollTop = editor.scrollTop;
}

editor.addEventListener('input', () => buildGutter());
editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, d = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(d);
    editor.selectionStart = editor.selectionEnd = s + 2;
    buildGutter();
  }
});

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

// ── Output ────────────────────────────────────────────────────────────────────
function appendOutput(text) {
  const empty = outputEl.querySelector('.out-empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'out-line';
  d.textContent = text;
  outputEl.appendChild(d);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function clearOutput() {
  outputEl.innerHTML = '<div class="out-empty">nessun output</div>';
}

// ── Memory panel ──────────────────────────────────────────────────────────────
function renderMemory(lines, pc) {
  if (!lines || lines.length === 0) { memoryEl.innerHTML = ''; return; }
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const n      = i + 1;
    const isPC   = n === pc;
    const isMod  = origLines[i] !== undefined && lines[i] !== origLines[i];
    const val    = lines[i] === '' ? '<span style="color:var(--text-m)">∅</span>' : escHtml(lines[i]);
    html += `<div class="mem-row${isPC ? ' pc-row' : ''}">
      <span class="mem-addr">${n}</span>
      <span class="mem-colon">:</span>
      <span class="mem-val${isMod ? ' mod' : ''}">${val}</span>
    </div>`;
  }
  memoryEl.innerHTML = html;
  const active = memoryEl.querySelector('.pc-row');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Input overlay ─────────────────────────────────────────────────────────────
function askInput(lineNum, resolve) {
  inputInfo.textContent = `riga ${lineNum} attende un valore`;
  inputField.value = '';
  inputOverlay.classList.remove('hidden');
  inputField.focus();
  inputResolver = resolve;
}

function submitInput() {
  if (!inputResolver) return;
  const v = inputField.value;
  inputOverlay.classList.add('hidden');
  const res = inputResolver;
  inputResolver = null;
  res(v);
}

inputOk.addEventListener('click', submitInput);
inputField.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

// ── RUN ───────────────────────────────────────────────────────────────────────
async function runProgram() {
  if (isRunning) return;
  isRunning = true; stepMode = false;
  clearOutput(); memoryEl.innerHTML = '';
  interp.load(editor.value);
  origLines = [...interp.lines];
  setStatus('IN ESECUZIONE', 'run');
  btnRun.classList.add('active');
  btnStop.disabled = false;
  btnRun.disabled  = true;
  btnStep.disabled = true;

  const delay = SPEEDS[+speedSlider.value][1];

  await interp.run({
    delay,
    onOutput: val => {
      appendOutput(val);
      buildGutter(interp.pc);
      renderMemory(interp.lines, interp.pc);
    },
    onInput: (lineNum, resolve) => {
      buildGutter(lineNum);
      renderMemory(interp.lines, lineNum);
      askInput(lineNum, resolve);
    },
    onStep: (pc, lines) => {
      buildGutter(pc);
      renderMemory(lines, pc);
    },
    onHalt: () => finishRun('TERMINATO')
  });
}

function finishRun(msg = 'TERMINATO') {
  isRunning = false; stepMode = false;
  btnRun.classList.remove('active');
  btnStop.disabled = true;
  btnRun.disabled  = false;
  btnStep.disabled = false;
  setStatus(msg);
  buildGutter();
  renderMemory(interp.lines, null);
}

// ── STEP ──────────────────────────────────────────────────────────────────────
function stepProgram() {
  if (isRunning && !stepMode) return;

  if (!stepMode) {
    stepMode = true;
    clearOutput(); memoryEl.innerHTML = '';
    interp.load(editor.value);
    origLines = [...interp.lines];
    btnStop.disabled = false;
    setStatus(`PC: 1`, 'step');
  }

  if (interp.halted) { finishRun('TERMINATO'); return; }

  const r = interp.step();

  if (r.status === 'output') {
    appendOutput(r.value);
  } else if (r.status === 'input') {
    buildGutter(r.line);
    renderMemory(interp.lines, r.line);
    setStatus(`IN ATTESA INPUT`, 'step');
    askInput(r.line, val => {
      interp.step(val);
      buildGutter(interp.pc);
      renderMemory(interp.lines, interp.pc);
      setStatus(`PC: ${interp.pc}`, 'step');
    });
    return;
  } else if (r.status === 'halt') {
    finishRun('TERMINATO');
    return;
  }

  buildGutter(interp.pc);
  renderMemory(interp.lines, interp.pc);
  setStatus(`PC: ${interp.pc}`, 'step');
}

// ── STOP / RESET ──────────────────────────────────────────────────────────────
function stopProgram() {
  interp.halted = true; isRunning = false; stepMode = false;
  if (inputResolver) { inputOverlay.classList.add('hidden'); inputResolver(''); inputResolver = null; }
  finishRun('FERMATO');
}

function resetProgram() {
  stopProgram();
  clearOutput(); memoryEl.innerHTML = '';
  setStatus('PRONTO');
  buildGutter();
}

btnRun.addEventListener('click', runProgram);
btnStep.addEventListener('click', stepProgram);
btnStop.addEventListener('click', stopProgram);
btnReset.addEventListener('click', resetProgram);

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runProgram(); }
  if (e.key === 'F8')                 { e.preventDefault(); stepProgram(); }
  if (e.key === 'Escape')             { stopProgram(); }
});

// ── Examples ──────────────────────────────────────────────────────────────────
const EXAMPLES = {
  hello: `>Ciao, Mondo!`,

  counter:
`# Contatore da 1 a 5
0
#(2:#2 + 1)
>#2
? #2 - 5 : @3`,

  input:
`>Come ti chiami?

>Ciao, #2!`,

  selfmod:
`A
B
C
#(1:D)
>#1
>#2
>#3`,

  fib:
`# Fibonacci: prime 8 cifre
# Riga 9 = a, Riga 10 = b, Riga 11 = temp, Riga 12 = contatore
@9
0
1
0
0
>#9
>#10
>#11
>#12
@13
0
1
0
0
>#9
#(11:#9 + #10)
#(9:#10)
#(10:#11)
>#10
#(12:#12 + 1)
? #12 - 6 : @16`
};

// Reworked simpler Fibonacci:
EXAMPLES.fib =
`# Fibonacci: prime 8 coppie (a, b)
# linee dati: 8=a, 9=b, 10=temp, 11=contatore
@12
0
1
0
0
0
0
0
0
>#8
>#9
#(10:#8 + #9)
#(8:#9)
#(9:#10)
#(11:#11 + 1)
? #11 - 7 : @9`;

// Fibonacci: 10 termini con contatore
// Linee dati: 2=a, 3=b, 4=temp, 5=contatore
EXAMPLES.fib =
`@6
0
1
0
0
>#2
#(4:#2 + #3)
#(2:#3)
#(3:#4)
#(5:#5 + 1)
? #5 - 10 : @6`;

examplesEl.addEventListener('change', () => {
  const v = examplesEl.value;
  if (v && EXAMPLES[v]) {
    editor.value = EXAMPLES[v];
    resetProgram();
  }
  examplesEl.value = '';
});

// ── Init ──────────────────────────────────────────────────────────────────────
editor.value = EXAMPLES.counter;
buildGutter();
</script>
</body>
</html>
