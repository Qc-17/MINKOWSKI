<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINKOWSKI IDE</title>
<link rel="icon" type="image/png" href="favicon.png"> 
<script src="interpreter.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #050810;
  --surface:   #090d16;
  --panel:     #0c1020;
  --border:    #16213a;
  --border2:   #1e2f4a;
  --cyan:      #00cef5;
  --cyan-d:    #00708a;
  --cyan-glow: rgba(0,206,245,0.12);
  --orange:    #ff6b35;
  --orange-d:  rgba(255,107,53,0.12);
  --green:     #5dfc9e;
  --green-d:   rgba(93,252,158,0.09);
  --amber:     #ffbe45;
  --violet:    #b57bff;
  --text:      #bfcfe0;
  --text-d:    #4a6a88;
  --text-m:    #1e3248;
  --font: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── HEADER ──────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 8px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  user-select: none;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.brand-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 5px;
  color: var(--cyan);
}

.brand-sub {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-d);
}

.sep { width: 1px; height: 28px; background: var(--border2); }

.controls { display: flex; gap: 5px; }

button {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-d);
  font-family: var(--font);
  font-size: 11px;
  padding: 5px 13px;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1.5px;
  transition: all 0.12s;
  white-space: nowrap;
}
button:hover          { color: var(--text); border-color: var(--text-d); }
#btn-run:hover        { color: var(--green); border-color: var(--green); background: var(--green-d); }
#btn-run.active       { color: var(--green); border-color: var(--green); background: var(--green-d); }
#btn-step:hover       { color: var(--amber); border-color: var(--amber); }
#btn-stop:hover       { color: var(--orange); border-color: var(--orange); background: var(--orange-d); }
button:disabled       { opacity: 0.3; cursor: default; pointer-events: none; }

.examples-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: var(--text-d);
  letter-spacing: 1px;
}

select {
  background: var(--panel);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
select:hover { border-color: var(--cyan-d); }

.toggles-wrap {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 10px;
  color: var(--text-d);
  letter-spacing: 1px;
}

.toggle-item {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.toggle-checkbox {
  width: 14px;
  height: 14px;
  cursor: pointer;
  accent-color: var(--cyan);
}

.toggle-item label {
  cursor: pointer;
}

.speed-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  font-size: 10px;
  color: var(--text-d);
  letter-spacing: 1px;
}

.speed-wrap.hidden {
  display: none !important;
}

input[type=range] {
  width: 72px;
  accent-color: var(--cyan);
  cursor: pointer;
}
#speed-val { color: var(--cyan); width: 28px; display: inline-block; }

.status {
  font-size: 10px;
  letter-spacing: 2px;
  padding: 4px 10px;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--text-d);
  white-space: nowrap;
}
.status.run   { color: var(--green);  border-color: rgba(93,252,158,0.3); background: var(--green-d); }
.status.step  { color: var(--amber);  border-color: rgba(255,190,69,0.3); }
.status.halt  { color: var(--text-d); }
.status.error { color: var(--orange); border-color: rgba(255,107,53,0.3); }

/* ── MAIN ────────────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── EDITOR ──────────────────────────────────────────────────── */
.editor-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-width: 0;
  border-right: 1px solid var(--border);
}

.gutter {
  width: 50px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding-top: 13px;
}

.gutter-line {
  height: 22px;
  line-height: 22px;
  text-align: right;
  padding-right: 10px;
  font-size: 12px;
  color: var(--text-m);
  transition: color 0.08s, background 0.08s;
  cursor: default;
}
.gutter-line.pc {
  color: var(--orange) !important;
  background: rgba(255,107,53,0.1);
  font-weight: 700;
}
.gutter-line.done { color: var(--text-d); }

#editor {
  flex: 1;
  background: var(--panel);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 22px;
  padding: 13px 16px;
  border: none;
  outline: none;
  resize: none;
  overflow-y: scroll;
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
  caret-color: var(--cyan);
}
#editor::selection { background: rgba(0,206,245,0.18); }
#editor::-webkit-scrollbar { width: 5px; height: 5px; }
#editor::-webkit-scrollbar-track { background: transparent; }
#editor::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── RIGHT PANE ──────────────────────────────────────────────── */
.right-pane {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
  border-left: 1px solid var(--border);
}

.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel + .panel { border-top: 1px solid var(--border); }

.panel.hidden {
  display: none !important;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-d);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.panel-head .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan-d);
  flex-shrink: 0;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.75;
  min-height: 0;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* Output */
.out-line {
  color: var(--green);
  white-space: pre-wrap;
  word-break: break-all;
  margin-bottom: 4px;
}
.out-line::before { content: '▸ '; color: var(--cyan-d); font-size: 10px; }
.out-empty { color: var(--text-d); font-style: italic; font-size: 11px; }

.input-line {
  display: flex;
  gap: 6px;
  margin-bottom: 4px;
  align-items: flex-end;
}
.input-line::before { content: '◀ '; color: var(--amber); font-size: 10px; }
.input-line input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--cyan-d);
  border-radius: 2px;
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 6px;
  outline: none;
  caret-color: var(--cyan);
}
.input-line input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 8px rgba(0,206,245,0.2);
}
.input-line button {
  padding: 4px 8px;
  font-size: 10px;
  background: var(--cyan-glow);
  border-color: var(--cyan-d);
  color: var(--cyan);
}
.input-line button:hover {
  background: rgba(0,206,245,0.2);
  border-color: var(--cyan);
}

/* Memory */
.mem-row {
  display: flex;
  gap: 0;
  padding: 1px 0;
  border-bottom: 1px solid rgba(22,33,58,0.6);
  align-items: baseline;
}
.mem-row.pc-row { background: rgba(255,107,53,0.08); border-radius: 2px; }

.mem-addr {
  color: var(--amber);
  width: 30px;
  flex-shrink: 0;
  text-align: right;
  font-size: 11px;
  opacity: 0.7;
}
.mem-row.pc-row .mem-addr { color: var(--orange); opacity: 1; }

.mem-colon { color: var(--text-m); padding: 0 5px 0 2px; font-size: 11px; }

.mem-val {
  color: var(--text);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.mem-val.mod { color: var(--cyan); }

/* ── SCROLLBAR SYNC ──────────────────────────────────────────── */
.gutter::-webkit-scrollbar { display: none; }

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 1024px) {
  header {
    gap: 12px;
    padding: 8px 12px;
  }
  
  .toggles-wrap {
    gap: 10px;
    order: 10;
    width: 100%;
    flex-wrap: wrap;
  }
}

@media (max-width: 768px) {
  header {
    gap: 10px;
    padding: 6px 10px;
    flex-wrap: wrap;
  }
  
  .brand-name {
    font-size: 12px;
    letter-spacing: 3px;
  }
  
  .brand-sub {
    font-size: 8px;
    letter-spacing: 1px;
  }
  
  .sep { display: none; }
  
  .controls {
    gap: 3px;
    flex: 1;
  }
  
  button {
    font-size: 10px;
    padding: 4px 8px;
    flex: 1;
  }
  
  .examples-wrap {
    font-size: 9px;
    flex: 1;
  }
  
  select {
    font-size: 10px;
    padding: 3px 6px;
    flex: 1;
  }
  
  .toggles-wrap {
    font-size: 9px;
    gap: 8px;
    order: 10;
    width: 100%;
  }
  
  main {
    flex-direction: column;
  }
  
  .editor-wrap {
    border-right: none;
    border-bottom: 1px solid var(--border);
    flex: 0.5;
  }
  
  .right-pane {
    width: 100%;
    flex: 0.5;
    border-left: none;
    border-top: 1px solid var(--border);
  }
  
  .gutter {
    width: 40px;
    padding-top: 8px;
  }
  
  .gutter-line {
    height: 20px;
    line-height: 20px;
    padding-right: 8px;
    font-size: 11px;
  }
  
  #editor {
    font-size: 12px;
    padding: 8px 12px;
    line-height: 20px;
  }
  
  .panel-body {
    padding: 6px 8px;
    font-size: 11px;
  }
}

@media (max-width: 480px) {
  header {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    padding: 6px 8px;
  }
  
  .brand {
    margin-bottom: 4px;
  }
  
  .controls {
    width: 100%;
    gap: 2px;
  }
  
  button {
    font-size: 9px;
    padding: 3px 6px;
  }
  
  .examples-wrap {
    width: 100%;
    font-size: 9px;
  }
  
  select {
    flex: 1;
  }
  
  .toggles-wrap {
    width: 100%;
    gap: 8px;
    font-size: 9px;
  }
  
  .toggle-item label {
    font-size: 9px;
  }
  
  .speed-wrap {
    font-size: 9px;
    width: 100%;
  }
  
  .status {
    font-size: 9px;
    padding: 3px 8px;
  }
  
  main {
    flex-direction: column;
  }
  
  .editor-wrap {
    flex: 1;
  }
  
  .right-pane {
    width: 100%;
    flex: 1;
  }
  
  .gutter {
    width: 32px;
  }
  
  #editor {
    font-size: 11px;
    line-height: 18px;
    padding: 6px 10px;
  }
  
  .panel-body {
    padding: 4px 6px;
    font-size: 10px;
    line-height: 1.5;
  }
  
  .out-line {
    font-size: 10px;
    margin-bottom: 2px;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">MINKOWSKI</div>
    <div class="brand-sub">MINIMALIST KODING WRITING SYSTEM</div>
  </div>
  <div class="controls">
    <button id="btn-run">▶ RUN</button>
    <button id="btn-step">⏭ STEP</button>
    <button id="btn-stop" disabled>⏹ STOP</button>
    <button id="btn-reset">↺ RESET</button>
  </div>
  <div class="examples-wrap">
    ESEMPI
    <select id="examples">
      <option value="">── scegli ──</option>
      <option value="hello">Hello World</option>
      <option value="counter">Contatore 1–5</option>
      <option value="input">Saluto</option>
      <option value="selfmod">Auto-modifica</option>
      <option value="fib">Fibonacci</option>
    </select>
  </div>
  <div class="toggles-wrap">
    <div class="toggle-item">
      <input type="checkbox" id="toggle-speed" class="toggle-checkbox">
      <label for="toggle-speed">VELOCITÀ</label>
    </div>
    <div class="toggle-item">
      <input type="checkbox" id="toggle-memory" class="toggle-checkbox">
      <label for="toggle-memory">MEMORIA</label>
    </div>
  </div>
  <div class="speed-wrap hidden" id="speed-wrap">
    <input type="range" id="speed" min="0" max="5" value="3">
    <span id="speed-val">×1</span>
  </div>
  <div class="status" id="status">PRONTO</div>
</header>

<main>
  <div class="editor-wrap">
    <div class="gutter" id="gutter"></div>
    <textarea id="editor" spellcheck="false" autocorrect="off"
              autocomplete="off" autocapitalize="off"></textarea>
  </div>

  <div class="right-pane">
    <div class="panel" style="flex:1">
      <div class="panel-head"><div class="dot"></div>OUTPUT</div>
      <div class="panel-body" id="output">
        <div class="out-empty">nessun output</div>
      </div>
    </div>
    <div class="panel hidden" id="memory-panel" style="flex:1">
      <div class="panel-head"><div class="dot"></div>MEMORIA</div>
      <div class="panel-body" id="memory"></div>
    </div>
  </div>
</main>

<script>
// ── Elements ──────────────────────────────────────────────────────────
const editor         = document.getElementById('editor');
const gutter         = document.getElementById('gutter');
const outputEl       = document.getElementById('output');
const memoryEl       = document.getElementById('memory');
const memoryPanel    = document.getElementById('memory-panel');
const statusEl       = document.getElementById('status');
const speedSlider    = document.getElementById('speed');
const speedVal       = document.getElementById('speed-val');
const speedWrap      = document.getElementById('speed-wrap');
const examplesEl     = document.getElementById('examples');
const toggleSpeed    = document.getElementById('toggle-speed');
const toggleMemory   = document.getElementById('toggle-memory');

const btnRun   = document.getElementById('btn-run');
const btnStep  = document.getElementById('btn-step');
const btnStop  = document.getElementById('btn-stop');
const btnReset = document.getElementById('btn-reset');

// ── Interpreter ─────────────────────────────────────────────────────────
const interp = new MinkowskiInterpreter();
let isRunning      = false;
let stepMode       = false;
let origLines      = [];
let inputResolver  = null;
let awaitingInput  = false;

// ── Toggles ──────────────────────────────────────────────────────────
toggleSpeed.addEventListener('change', () => {
  speedWrap.classList.toggle('hidden', !toggleSpeed.checked);
});

toggleMemory.addEventListener('change', () => {
  memoryPanel.classList.toggle('hidden', !toggleMemory.checked);
});

// ── Speed ───────────────────────────────────────────────────────────
const SPEEDS = [
  ['×¼', 800], ['×½', 300], ['×1', 100], ['×2', 30], ['×4', 5], ['MAX', 0]
];
speedSlider.addEventListener('input', () => {
  speedVal.textContent = SPEEDS[+speedSlider.value][0];
});
speedVal.textContent = SPEEDS[+speedSlider.value][0];

// ── Gutter (line numbers) ─────────────────────────────────────────────────────
function buildGutter(pcLine = null, doneBefore = 0) {
  const lines = editor.value.split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const n   = i + 1;
    let cls = '';
    if (n === pcLine)      cls = ' pc';
    else if (n < doneBefore) cls = ' done';
    html += `<div class="gutter-line${cls}">${n}</div>`;
  }
  gutter.innerHTML = html;
  gutter.scrollTop = editor.scrollTop;
}

editor.addEventListener('input', () => buildGutter());
editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, d = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(d);
    editor.selectionStart = editor.selectionEnd = s + 2;
    buildGutter();
  }
});

// ── Status ───────────────────────────────────────────────────────────
function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

// ── Output ───────────────────────────────────────────────────────────
function appendOutput(text) {
  const empty = outputEl.querySelector('.out-empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'out-line';
  d.textContent = text;
  outputEl.appendChild(d);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function clearOutput() {
  outputEl.innerHTML = '<div class="out-empty">nessun output</div>';
}

// ── Input inline ──────────────────────────────────────────────────────────
function askInputInline(lineNum, resolve) {
  const empty = outputEl.querySelector('.out-empty');
  if (empty) empty.remove();
  
  const d = document.createElement('div');
  d.className = 'input-line';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = `riga ${lineNum}: inserisci valore…`;
  
  const btn = document.createElement('button');
  btn.textContent = '✓';
  
  const submit = () => {
    if (inputResolver) {
      const v = input.value;
      inputResolver(v);
      inputResolver = null;
      awaitingInput = false;
      d.remove();
    }
  };
  
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });
  btn.addEventListener('click', submit);
  
  d.appendChild(input);
  d.appendChild(btn);
  outputEl.appendChild(d);
  outputEl.scrollTop = outputEl.scrollHeight;
  input.focus();
  
  inputResolver = resolve;
  awaitingInput = true;
}

// ── Memory panel ──────────────────────────────────────────────────────────
function renderMemory(lines, pc) {
  if (!toggleMemory.checked) return;
  if (!lines || lines.length === 0) { memoryEl.innerHTML = ''; return; }
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const n      = i + 1;
    const isPC   = n === pc;
    const isMod  = origLines[i] !== undefined && lines[i] !== origLines[i];
    const val    = lines[i] === '' ? '<span style="color:var(--text-m)">∅</span>' : escHtml(lines[i]);
    html += `<div class="mem-row${isPC ? ' pc-row' : ''}">
      <span class="mem-addr">${n}</span>
      <span class="mem-colon">:</span>
      <span class="mem-val${isMod ? ' mod' : ''}">${val}</span>
    </div>`;
  }
  memoryEl.innerHTML = html;
  const active = memoryEl.querySelector('.pc-row');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── RUN ────────────────────────────────────────────────────────────
async function runProgram() {
  if (isRunning) return;
  isRunning = true; stepMode = false;
  clearOutput();
  if (toggleMemory.checked) memoryEl.innerHTML = '';
  interp.load(editor.value);
  origLines = [...interp.lines];
  setStatus('IN ESECUZIONE', 'run');
  btnRun.classList.add('active');
  btnStop.disabled = false;
  btnRun.disabled  = true;
  btnStep.disabled = true;

  const delay = SPEEDS[+speedSlider.value][1];

  await interp.run({
    delay,
    onOutput: val => {
      appendOutput(val);
      buildGutter(interp.pc);
      renderMemory(interp.lines, interp.pc);
    },
    onInput: (lineNum, resolve) => {
      buildGutter(lineNum);
      renderMemory(interp.lines, lineNum);
      askInputInline(lineNum, resolve);
    },
    onStep: (pc, lines) => {
      buildGutter(pc);
      renderMemory(lines, pc);
    },
    onHalt: () => finishRun('TERMINATO')
  });
}

function finishRun(msg = 'TERMINATO') {
  isRunning = false; stepMode = false;
  btnRun.classList.remove('active');
  btnStop.disabled = true;
  btnRun.disabled  = false;
  btnStep.disabled = false;
  setStatus(msg);
  buildGutter();
  renderMemory(interp.lines, null);
}

// ── STEP ────────────────────────────────────────────────────────────
function stepProgram() {
  if (isRunning && !stepMode) return;

  if (!stepMode) {
    stepMode = true;
    clearOutput();
    if (toggleMemory.checked) memoryEl.innerHTML = '';
    interp.load(editor.value);
    origLines = [...interp.lines];
    btnStop.disabled = false;
    setStatus(`PC: 1`, 'step');
  }

  if (interp.halted) { finishRun('TERMINATO'); return; }

  const r = interp.step();

  if (r.status === 'output') {
    appendOutput(r.value);
  } else if (r.status === 'input') {
    buildGutter(r.line);
    renderMemory(interp.lines, r.line);
    setStatus(`IN ATTESA INPUT`, 'step');
    askInputInline(r.line, val => {
      interp.step(val);
      buildGutter(interp.pc);
      renderMemory(interp.lines, interp.pc);
      setStatus(`PC: ${interp.pc}`, 'step');
    });
    return;
  } else if (r.status === 'halt') {
    finishRun('TERMINATO');
    return;
  }

  buildGutter(interp.pc);
  renderMemory(interp.lines, interp.pc);
  setStatus(`PC: ${interp.pc}`, 'step');
}

// ── STOP / RESET ──────────────────────────────────────────────────────────
function stopProgram() {
  interp.halted = true; isRunning = false; stepMode = false;
  if (awaitingInput) { awaitingInput = false; inputResolver = null; }
  finishRun('FERMATO');
}

function resetProgram() {
  stopProgram();
  clearOutput();
  if (toggleMemory.checked) memoryEl.innerHTML = '';
  setStatus('PRONTO');
  buildGutter();
}

btnRun.addEventListener('click', runProgram);
btnStep.addEventListener('click', stepProgram);
btnStop.addEventListener('click', stopProgram);
btnReset.addEventListener('click', resetProgram);

// ── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runProgram(); }
  if (e.key === 'F8')                 { e.preventDefault(); stepProgram(); }
  if (e.key === 'Escape')             { stopProgram(); }
});
